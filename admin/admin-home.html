<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard - E-Ride</title>
</head>
<body>

    <table width="900" align="center" cellpadding="10" cellspacing="10" border="1">
        <tr>
            <td colspan="6">
                <h1>Admin Dashboard</h1>
            </td>
        </tr>

        <tr align="center">
            <td>
                <h2>200</h2>
                Total Users
            </td>
            <td>
                <h2>100</h2>
                Customers
            </td>
            <td>
                <h2>0</h2>
                Managers
            </td>
            <td>
                <h2>1</h2>
                Pending Requests
            </td>
            <td>
                <h2>0</h2>
                Stations
            </td>
            <td>
                <h2>৳0.00</h2>
                Total Revenue
            </td>
        </tr>

        <tr>
            <td colspan="6">
                <h2>Quick Links</h2>

                <table  cellpadding="10" cellspacing="0" border="0">
                    <tr align="center">
                        <td>Manage Users</td>
                        <td>Manager Requests</td>
                        <td>Manage Stations</td>
                        <td>+ Add Station</td>
                        <td>View Payments</td>
                        <td>View Transactions</td>
                    </tr>
                </table>
            </td>
        </tr>

        <tr>
            <td colspan="6">
                <h2>Stations Overview</h2>

                <table width="100%" cellpadding="10" cellspacing="0" border="0">
                    <tr>
                        <th align="left">Station</th>
                        <th align="left">Manager</th>
                        <th align="left">Available</th>
                        <th align="left">Capacity</th>
                        <th align="left">Status</th>
                    </tr>

                    

                    
                </table>
            </td>
        </tr>

</html>
