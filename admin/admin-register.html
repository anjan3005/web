<!DOCTYPE html>
<html>
<head>
    <title>E-Ride Registration</title>
</head>
<body>

    <h1 align="center">E-Ride Services</h1>

    <table width="550" align="center" cellpadding="15" cellspacing="0" border="1">
        <tr>
            <td>
                <form action="#" method="post">
                    <table width="100%" cellpadding="10" cellspacing="0" border="0">
                        <tr>
                            <td colspan="2" align="center">
                                <h2>Welcome</h2>
                                <p>Create your E-Ride account</p>
                            </td>
                        </tr>

                        <tr>
                            <td colspan="2" align="right">
                                <label>Create as</label>
                                <select name="role">
                                    <option>Customer</option>
                                    <option>Manager</option>
                                    <option>Admin</option>
                                </select>
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label>Name</label><br><br>
                                <input type="text" name="name" placeholder="Enter your name" >
                            </td>
                            <td>
                                <label>Date of birth</label><br><br>
                                <input type="date" name="dob" >
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label>Gender</label><br><br>
                                <select name="gender" >
                                    <option value="">Select gender</option>
                                    <option>Male</option>
                                    <option>Female</option>
                                    <option>Other</option>
                                </select>
                            </td>
                            <td>
                                <label>Area</label><br><br>
                                <input type="text" name="area" placeholder="Enter your area" >
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label>Block</label><br><br>
                                <input type="text" name="block" placeholder="Enter your block no" >
                            </td>
                            <td>
                                <label>Road no</label><br><br>
                                <input type="text" name="road" placeholder="Enter road no" >
                            </td>
                        </tr>

                        <tr>
                            <td colspan="2">
                                <label>Phone Number</label><br><br>
                                <input type="text" value="BD +880" size="7" >
                                <input type="tel" name="phone" placeholder="Enter your phone number" >
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label>Password</label><br><br>
                                <input type="password" name="password" placeholder="Create a password" required>
                            </td>
                            <td>
                                <label>Confirm Password</label><br><br>
                                <input type="password" name="confirm_password" placeholder="Confirm your password" required>
                            </td>
                        </tr>

                        <tr>
                            <td colspan="2" align="center">
                                <button type="submit">Sign Up</button>
                            </td>
                        </tr>

                        <tr>
                            <td colspan="2" align="center">
                                Already have an Account?
                                <a >Sign in</a>
                            </td>
                        </tr>
                    </table>
                </form>
            </td>
        </tr>
    </table>

</body>
</html>
